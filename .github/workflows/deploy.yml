name: Deploy
on: 
  push:
   branches: [main, 'hw/**']

jobs:
  checks:
    name: Run checks
    uses: ./.github/workflows/pr-check.yml

  build:
    name: build (${{ matrix.service }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: front
            build_args: "--build-arg VITE_API_URL=${{vars.VITE_API_URL}}"
          - service: back
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        run: echo ${{secrets.DOCKER_PASS}} | docker login -u ${{secrets.DOCKER_USER}} --password-stdin

      - name: Build and Push docker image
        env: 
          IMAGE_SHA: ${{secrets.DOCKER_USER}}/todo-${{matrix.service}}:${{github.sha}}
          IMAGE_LATEST: ${{secrets.DOCKER_USER}}/todo-${{matrix.service}}:latest
        run: |
          docker build ${{matrix.build_args}} -t ${{env.IMAGE_SHA}} -t ${{env.IMAGE_LATEST}} ${{matrix.service}}
          docker push ${{env.IMAGE_SHA}}
          docker push ${{env.IMAGE_LATEST}}
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT
  
  deploy:
    name: deploy (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: DOCKER_PASS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            cd myapp/
            sed -i "s|^APP_VERSION=.*|APP_VERSION=sha-${{ github.sha }}|" .env.development.compose
            docker compose up -d --no-deps back front